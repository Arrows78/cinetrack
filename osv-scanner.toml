# braces <= 3.0.3 — stack exhaustion on deeply nested brace patterns.
# No patched release exists: 3.0.3 is the latest published version and the
# advisory's affected range runs up to it. The only path to it is
# eslint-plugin-boundaries -> micromatch -> braces, i.e. dev-only lint
# tooling matching this repository's own configured globs; it is never part
# of the desktop bundle and never sees untrusted input. Remove this entry
# (it expires on its own) once micromatch or eslint-plugin-boundaries
# stops depending on it.
[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2027-01-10
reason = "Dev-only transitive dependency (eslint-plugin-boundaries -> micromatch); no patched version of braces exists"

# zip < 9.0.0 — unsafe permission and symlink handling when extracting an
# archive. Two copies, neither fixable from this repository: zip 4.6.1 is
# pinned by tauri-plugin-updater, whose update channel is not configured (no
# `plugins.updater` in tauri.conf.json), so nothing is ever extracted; zip 8.6.0
# is a build-dependency of libsodium-sys-stable that unpacks libsodium's own
# source tarball. Same entries as src-tauri/.cargo/audit.toml.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0367"
ignoreUntil = 2027-01-24
reason = "zip pinned by tauri-plugin-updater (updater not configured) and a libsodium build-dependency; no patched version reachable"

