# bincode 1.3.3 — "unmaintained" notice (not a CVE): the maintainer stopped
# development after a harassment incident and there is no patched release to
# move to. Pulled in transitively via tauri-plugin-stronghold -> iota_stronghold;
# this repo doesn't depend on bincode directly and can't pick its version.
[[IgnoredVulns]]
id = "RUSTSEC-2025-0141"
reason = "bincode — unmaintained (no fixed version exists), transitive via tauri-plugin-stronghold's iota_stronghold dependency"

# glib 0.18.5 — unlike the entries above, this ONE IS a real CVE (unsound
# VariantStrIter, fixed in glib 0.20.0) and not merely informational. It is
# listed here anyway because it is currently unfixable from this repo: glib is
# pinned to ^0.18 by gtk 0.18.2 (the last gtk3-rs release), which is the same
# tray-icon dependency chain as the GTK3 bindings above. `cargo update -p glib
# --dry-run` confirms no newer compatible version resolves. Re-check that
# command (or `cargo tree --target all -i glib`) after any tauri/tray-icon bump
# and drop this entry once a resolvable fix exists — don't just re-add it.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
reason = "glib — real CVE, but pinned to 0.18.5 by gtk 0.18.2 (tauri's Linux tray-icon GTK3 backend); no compatible fixed version exists until tauri migrates to gtk4-rs"

# zip < 9.0.0 — unsafe permission and symlink handling when extracting an
# archive. Two copies, neither fixable from this repository: zip 4.6.1 is
# pinned by tauri-plugin-updater, whose update channel is not configured (no
# `plugins.updater` in tauri.conf.json), so nothing is ever extracted; zip 8.6.0
# is a build-dependency of libsodium-sys-stable that unpacks libsodium's own
# source tarball. The same IDs are ignored by the cargo-audit job
# (.github/workflows/ci.yml): keep the two lists in step.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0367"
ignoreUntil = 2027-01-24
reason = "zip pinned by tauri-plugin-updater (updater not configured) and a libsodium build-dependency; no patched version reachable"

[[IgnoredVulns]]
