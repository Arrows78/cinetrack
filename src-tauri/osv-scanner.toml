# crypto-bigint 0.5.5 — timing variability in some operations. Pinned by
# elliptic-curve 0.13 / k256 0.13, reached only through tauri-plugin-stronghold
# (iota-crypto); the app uses Stronghold as a record store for the TMDB token,
# never to sign with a secret key. The fix is crypto-bigint 0.7, a different
# major of a RustCrypto stack Stronghold has not moved to.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0387"
ignoreUntil = 2027-01-24
reason = "crypto-bigint 0.5 pinned by k256 via tauri-plugin-stronghold; no secret-key signing happens; fix needs a new RustCrypto major"

