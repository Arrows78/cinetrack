# block-buffer 0.10.4 — GHSA-qwgh-2vcv-g2f7 (moderate): a panic in a
# caller-supplied crypto callback, if caught, can corrupt the buffer cursor
# and make subsequent reuse unsafe. The patch exists in block-buffer 0.12.1,
# which Cargo.lock already includes for digest 0.11. However digest 0.10.7
# still depends on block-buffer 0.10.x, and is pulled in transitively by
# the older RustCrypto stack (including Stronghold/iota-crypto). There is
# no patched 0.10.x release; forcing 0.12 requires upgrading that stack.
# Time-limited acceptance of this residual risk, NOT a global OSV bypass.
# Revisit on upstream Stronghold/RustCrypto upgrades and remove on expiry.
[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = 2027-01-24
reason = "Legacy digest 0.10 needs block-buffer 0.10.4 (Stronghold/iota-crypto and other crates); only incompatible block-buffer 0.12.1 is patched; exploitation requires catching a crypto callback panic and reusing the buffer"


