[package]
name = "cinetrack"
version = "0.3.0"
description = "CineTrack desktop application"
authors = ["Thomas Jost"]
license = "MIT"
repository = "https://github.com/Arrows78/cinetrack"
edition = "2024"

[lib]
name = "cinetrack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cinetrack"
path = "src/main.rs"
# The desktop entry point contains no tests. Disabling its test harness keeps
# Tauri's application manifest from colliding with the Common Controls v6
# manifest that build.rs embeds specifically for Windows Rust test binaries.
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the dependency tree transitively (sqlx/reqwest) — used directly
# only for a UTC ISO-8601 timestamp matching the frontend logger's own
# `new Date().toISOString()` format (see diagnostics.rs), not for any real
# date arithmetic.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "json"] }
uuid = { version = "1", features = ["v4", "v7"] }
# Generates the TS mirror of an IPC DTO straight from its Rust struct/enum
# (see docs/architecture.md's IPC boundary section) instead of hand-writing
# it in src/types/media.ts and hoping check-contract-drift.mjs's field-name
# diff catches drift — serde-compat (default feature) reads the existing
# #[serde(rename_all/tag/...)] attributes directly, so no duplicate #[ts(...)]
# annotations are needed on top of what's already there for serde.
ts-rs = "12"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-stronghold = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"

# Native share-sheet integration (iOS UIActivityViewController / Android
# Intent.ACTION_SEND) for exporting Wrapped/recap/milestone PNG cards on
# mobile — see wrapped-export.ts. Cargo.toml's target tables can't see
# Tauri's own `mobile`/`desktop` cfg aliases (those are only registered via
# tauri-build's build.rs, after Cargo has already resolved dependencies),
# so this uses the raw target_os list instead of `cfg(mobile)`.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-sharekit = "0.3"

# Native "sorry, something went wrong" dialog for the one failure mode that
# happens before any window (or even the webview) exists: a second startup
# migration failure after the quarantine-and-retry in database::init_pool_at
# already failed once. Linux uses the gtk3 backend specifically (not the
# default xdg-portal one) because message dialogs aren't part of the
# xdg-desktop-portal spec — rfd's portal backend falls back to shelling out
# to the `zenity` binary for them, which isn't guaranteed installed. GTK3
# itself already is: webkit2gtk (required for the Tauri webview on Linux)
# pulls it in regardless.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
rfd = { version = "0.15", default-features = false }

[dev-dependencies]
tauri = { version = "2", features = ["tray-icon", "test"] }
wiremock = "0.6"

[features]
# ts-rs's #[ts(export)] compiles to a real #[test] fn, so a plain `cargo
# test` — CI's cargo:test, or any dev running tests directly — would
# otherwise rewrite src/generated/dto on every run in ts-rs's raw,
# unformatted style, fighting with contract:generate-ts-bindings's
# prettier pass and making that directory look like it's constantly
# drifting. Gating the attribute behind this feature means only
# contract:generate-ts-bindings (which passes --features export-bindings)
# ever touches those files.
export-bindings = []
