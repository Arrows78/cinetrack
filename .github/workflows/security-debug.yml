name: Security debug

on:
  push:
    branches:
      - security/fix-vulnerabilities-code-scanning

permissions:
  contents: read
  security-events: read

concurrency:
  group: security-debug
  cancel-in-progress: true

jobs:
  security-alerts:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch open CodeQL and Dependabot alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPO/code-scanning/alerts?state=open&per_page=100" > code-scanning-alerts.json
          gh api --paginate "repos/$REPO/dependabot/alerts?state=open&per_page=100" > dependabot-alerts.json
          echo "Code scanning:"
          jq '[.[] | {number, rule: .rule.id, severity: .rule.security_severity_level, path: .most_recent_instance.location.path, line: .most_recent_instance.location.start_line}]' code-scanning-alerts.json
          echo "Dependabot:"
          jq '[.[] | {number, package: .dependency.package.name, ecosystem: .dependency.package.ecosystem, severity: .security_advisory.severity, ghsa: .security_advisory.ghsa_id, vulnerable: .security_vulnerability.vulnerable_version_range, patched: .security_vulnerability.first_patched_version.identifier}]' dependabot-alerts.json

      - name: Upload alert JSON
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-alerts
          path: |
            code-scanning-alerts.json
            dependabot-alerts.json
          retention-days: 1
