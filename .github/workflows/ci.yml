name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.6.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # VITE_TMDB_API_TOKEN is inlined into the frontend bundle at build time
      # (see README.md's security note) — a value present here would ship in
      # cleartext inside every artifact this job produces. Nothing wires this
      # secret into the job's env today; this is a tripwire against that
      # being added later without also gating it out of CI.
      - name: Refuse to build if a TMDB token is set in this job's env
        run: |
          if [ -n "$VITE_TMDB_API_TOKEN" ]; then
            echo "::error::VITE_TMDB_API_TOKEN is set in the CI environment — it would be baked into the built frontend bundle. Remove it from this workflow's secrets/env." >&2
            exit 1
          fi

      - name: Check generated Tauri contracts
        run: pnpm contract:check

      - name: Check frontend architecture boundaries
        run: pnpm architecture:check

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Test with coverage
        run: |
          mkdir -p test-results
          pnpm exec vitest run --coverage \
            --reporter=default \
            --reporter=github-actions \
            --reporter=junit \
            --outputFile.junit=./test-results/vitest-junit.xml

      - name: Upload frontend test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-test-diagnostics
          path: |
            test-results/vitest-junit.xml
            coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Typecheck
        run: pnpm typecheck

      - name: Build frontend
        run: pnpm build

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: Install Rust
        # Reads channel/components from rust-toolchain.toml at the repo root
        # (no `toolchain:` input given) — local `cargo`/`rustup` invocations
        # already respect that same file, so CI and local dev always build
        # with the exact same Rust version. `dtolnay/rust-toolchain@stable`
        # doesn't support that file at all (deliberately, per its own
        # README), which is why this uses a different action.
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          # This action's own build-in caching would stack with (and
          # duplicate) the explicit swatinem/rust-cache step below.
          cache: false
          # This action defaults to injecting RUSTFLAGS=-D warnings into
          # every cargo invocation in this job — cargo check/test below
          # aren't meant to be warnings-as-errors, only the explicit
          # `cargo clippy -- -D warnings` step is. Empty string opts out.
          rustflags: ""

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Check Rust application
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust application
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test Rust application
        env:
          RUST_BACKTRACE: "1"
          CINETRACK_WINDOWS_TEST_MANIFEST: "1"
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --nocapture

      - name: Record database performance baseline
        if: runner.os == 'Linux'
        run: >-
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          stats::performance::benchmark_library_progress_and_stats_at_1k_10k_and_50k_scale
          -- --ignored --nocapture

      - name: Upload database performance baseline
        if: runner.os == 'Linux' && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: database-performance-baseline
          path: src-tauri/target/performance/database-benchmark.*
          if-no-files-found: error
          retention-days: 30

      # Informational only (see docs/performance.md) — turns this PR's own
      # benchmark run into a "main vs. PR vs. delta" table instead of a
      # snapshot artifact a human has to manually download and eyeball
      # across runs. Skipped on a push-to-main run: there's no "PR" to
      # compare main against in that case, and main's own freshly-uploaded
      # artifact above already is next time's baseline.
      - name: Download main's latest database performance baseline
        if: runner.os == 'Linux' && !cancelled() && github.event_name == 'pull_request'
        id: download-main-baseline
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "ci.yml",
              branch: "main",
              status: "success",
              per_page: 1,
            });
            const run = runs.data.workflow_runs[0];
            if (!run) {
              core.warning("No successful CI run on main yet — skipping the performance comparison.");
              core.setOutput("found", "false");
              return;
            }
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: run.id,
            });
            const artifact = artifacts.data.artifacts.find((a) => a.name === "database-performance-baseline");
            if (!artifact) {
              core.warning(`main's latest successful run (${run.id}) has no database-performance-baseline artifact — skipping.`);
              core.setOutput("found", "false");
              return;
            }
            const download = await github.rest.actions.downloadArtifact({
              owner,
              repo,
              artifact_id: artifact.id,
              archive_format: "zip",
            });
            const fs = require("node:fs");
            fs.writeFileSync("main-baseline.zip", Buffer.from(download.data));
            core.setOutput("found", "true");

      - name: Compare this PR's benchmark against main's baseline
        if: runner.os == 'Linux' && !cancelled() && steps.download-main-baseline.outputs.found == 'true'
        run: |
          mkdir -p main-baseline
          unzip -o main-baseline.zip -d main-baseline
          node scripts/compare-performance-baseline.mjs \
            main-baseline/database-benchmark.json \
            src-tauri/target/performance/database-benchmark.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

  cargo-audit:
    runs-on: ubuntu-latest
    # rustsec/audit-check reports its result as a GitHub Check Run, which
    # needs write access beyond the workflow's default contents:read — without
    # it the action itself fails with "Resource not accessible by integration"
    # even when the audit found zero vulnerabilities.
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Audit Rust dependencies against the RustSec advisory database
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  osv-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        -r
        ./
