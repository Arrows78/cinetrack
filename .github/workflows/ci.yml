name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # VITE_TMDB_API_TOKEN is inlined into the frontend bundle at build time
      # (see README.md's security note) — a value present here would ship in
      # cleartext inside every artifact this job produces. Nothing wires this
      # secret into the job's env today; this is a tripwire against that
      # being added later without also gating it out of CI.
      - name: Refuse to build if a TMDB token is set in this job's env
        run: |
          if [ -n "$VITE_TMDB_API_TOKEN" ]; then
            echo "::error::VITE_TMDB_API_TOKEN is set in the CI environment — it would be baked into the built frontend bundle. Remove it from this workflow's secrets/env." >&2
            exit 1
          fi

      - name: Check generated Tauri contracts
        run: pnpm contract:check

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Test with coverage
        run: |
          mkdir -p test-results
          pnpm exec vitest run --coverage \
            --reporter=default \
            --reporter=github-actions \
            --reporter=junit \
            --outputFile.junit=./test-results/vitest-junit.xml

      - name: Upload frontend test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-diagnostics
          path: |
            test-results/vitest-junit.xml
            coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Typecheck
        run: pnpm typecheck

      - name: Build frontend
        run: pnpm build

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Check Rust application
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust application
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test Rust application
        env:
          RUST_BACKTRACE: "1"
          CINETRACK_WINDOWS_TEST_MANIFEST: "1"
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --nocapture

      - name: Record database performance baseline
        if: runner.os == 'Linux'
        env:
          CINETRACK_PERF_REPORT: src-tauri/target/performance/database-benchmark.json
        run: >-
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          stats::performance::benchmark_library_progress_and_stats_at_1k_and_10k_scale
          -- --ignored --nocapture

      - name: Upload database performance baseline
        if: runner.os == 'Linux' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: database-performance-baseline
          path: src-tauri/target/performance/database-benchmark.*
          if-no-files-found: error
          retention-days: 30

  cargo-audit:
    runs-on: ubuntu-latest
    # rustsec/audit-check reports its result as a GitHub Check Run, which
    # needs write access beyond the workflow's default contents:read — without
    # it the action itself fails with "Resource not accessible by integration"
    # even when the audit found zero vulnerabilities.
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v7

      - name: Audit Rust dependencies against the RustSec advisory database
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  osv-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1"
    with:
      scan-args: |-
        -r
        ./
