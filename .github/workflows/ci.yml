name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # VITE_TMDB_API_TOKEN is inlined into the frontend bundle at build time
      # (see README.md's security note) — a value present here would ship in
      # cleartext inside every artifact this job produces. Nothing wires this
      # secret into the job's env today; this is a tripwire against that
      # being added later without also gating it out of CI.
      - name: Refuse to build if a TMDB token is set in this job's env
        run: |
          if [ -n "$VITE_TMDB_API_TOKEN" ]; then
            echo "::error::VITE_TMDB_API_TOKEN is set in the CI environment — it would be baked into the built frontend bundle. Remove it from this workflow's secrets/env." >&2
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build frontend
        run: pnpm build

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Check Rust application
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust application
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust application
        run: cargo test --manifest-path src-tauri/Cargo.toml

  cargo-audit:
    runs-on: ubuntu-latest
    # rustsec/audit-check reports its result as a GitHub Check Run, which
    # needs write access beyond the workflow's default contents:read — without
    # it the action itself fails with "Resource not accessible by integration"
    # even when the audit found zero vulnerabilities.
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v7

      - name: Audit Rust dependencies against the RustSec advisory database
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  osv-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.0"
    with:
      scan-args: |-
        -r
        ./
