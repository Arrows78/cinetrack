version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    # A version published minutes ago is the one most likely to be broken or
    # yanked: wait a few days before proposing it.
    cooldown:
      default-days: 3
    groups:
      npm-development:
        dependency-type: development
        patterns:
          - "*"
      npm-production:
        dependency-type: production
        patterns:
          - "*"
    ignore:
      # typescript-eslint doesn't support TS 7.x yet (as of 8.65.0), so a
      # grouped bump to typescript@7 breaks `pnpm lint` in CI. Drop this
      # once https://github.com/typescript-eslint/typescript-eslint/issues/10940
      # is resolved and typescript-eslint has been bumped to a version that
      # supports it.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      # rust-ini 0.21.3 added two public fields to `ParseOption`, which
      # tauri-plugin-deep-link 2.6.2 builds with a struct literal on Linux
      # only: the bump compiled everywhere but the Linux CI job (and would
      # break the Linux release build). Cargo.lock is pinned to 0.21.1, the
      # last version checked to work; 0.21.2 was not tried, hence ">=0.21.2".
      # Drop this once tauri-plugin-deep-link is released with the fix.
      - dependency-name: "rust-ini"
        versions: [">=0.21.2"]
    commit-message:
      prefix: "build(deps)"
