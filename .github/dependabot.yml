version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      npm-development:
        dependency-type: development
        patterns:
          - "*"
      npm-production:
        dependency-type: production
        patterns:
          - "*"
    ignore:
      # typescript-eslint doesn't support TS 7.x yet (as of 8.65.0), so a
      # grouped bump to typescript@7 breaks `pnpm lint` in CI. Drop this
      # once https://github.com/typescript-eslint/typescript-eslint/issues/10940
      # is resolved and typescript-eslint has been bumped to a version that
      # supports it.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
